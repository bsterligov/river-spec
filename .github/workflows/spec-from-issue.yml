name: Spec Workflow

# On new issue: create a spec branch and draft PR with a pre-filled prompt.
# Implementation is no longer started here: when a spec PR merges, pack.md compiles
# per-repo context packs (see docs/v2.md).

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number
        required: true
        type: number

env:
  MISE_AUTO_INSTALL: false

jobs:
  create-draft:
    name: Create Spec Draft PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: Create draft spec and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          mise run agent:spec-draft
          mise run agent:spec-publish
